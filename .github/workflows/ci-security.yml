name: unit-test
on:
  push:
    branches: [main]
  pull_request: 
  workflow_dispatch: 

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v6.1.0
          
        - name: Setup Python
          uses: actions/setup-python@v7.0.0
          
        - name: Install Dependencies
          run:  pip install -r requirements.txt 
          
        - name: Run test
          run: pytest test_calculator.py
          
        - name: Run bandit
          run: bandit -r .
          
         
